# This job doesn't gate PR merging \ artifact promotion
# because it sometimes takes weeks for a core package (typically nestjs or react in our case)
# to bump a transitive dependency when a "nested" vulnerability is reported.
# In this case, we should investigate the particular vulnerability
# and confirm that it isn't possible to hit the issue in our usage of the given lib.
name: "NPM Package Audit"
on:
  push:
    pull_request:
      branches 
        - integration
        - staging
      schedule:
        - cron '0 0 ** 0' # Every Sunday at midnight

jobs:
  npm-audit-server:
    name: NPM Dependency Audit (server)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node/@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.13.0
      - name: NPM Audit server dependencies
        run: yarn audit --groups dependencies
        working-directory: ./apps/server

  # This is a good use case for composite actions
  npm-audit-client:
    name: NPM Dependency Audit (web-client) 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up Node.js
        uses: actions/setup-node/@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.13.0
      - name: NPM Audit server dependencies
        run: yarn audit --groups dependencies
        working-directory: ./apps/web-client