name: CI

on:
  pull_request:
    branches:
      - integration

# cancel in-progress runs on next push
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      # TODO pin all actions to a specific SHA
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Node.js
        uses: actions/setup-node/@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.13.0
      - name: Install back-end dependencies
        run: yarn install --frozen-lock-file
        working-directory: ./apps/server

      - name: Lint server
        run: yarn run lint
        working-directory: ./apps/server

      - name: Build server
        run: yarn run build
        working-directory: ./apps/server

      - name: Unit test server
        run: yarn run test
        working-directory: ./apps/server

      - name: Upload server artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server
          path: |
            ./apps/server/dist
            ./apps/server/node_modules
          if-no-files-found: error

      - name: build web admin client
        run: yarn run build
        working-directory: ./apps/web-client

      - name: Upload admin web-client artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-client
          path: |
            ./apps/web-client/build

          if-no-files-found: error 

      - name: Copy sample.env to .env.e2e
        # TODO use environment
        run: cp sample.env .env.e2e

      - name: Start containerized app
        run: |
          docker compose --env-file .env.e2e up -d --build

      - name: Wait for Server
        run: npx wait-on http://127.0.0.1:3234 --timeout 60000

      - name: e2e test server
        env:
          SYSTEM_ADMIN_USERNAME: ${{ secrets.SYSTEM_ADMIN_USERNAME }}
          INITIAL_ADMIN_PASSWORD: ${{ secrets.INITIAL_ADMIN_PASSWORD }}
        run: |
          wget http://127.0.0.1:3234
          cat index.html
          rm index.html
          yarn run jest --runInBand
        working-directory: ./apps/server
      - if: always()
        run: |
          docker compose --env-file .env.e2e down -v

  ci-gate:
    runs-on: ubuntu-latest
    needs: [build]
    if: always()
    steps:
      - name: Verify CI Quality Checks(lint, build, unit test, server e2e tests)
        run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            echo "Required jobs failed!"
            exit 1
          fi
