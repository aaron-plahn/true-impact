services:
  db:
    image: "postgres:latest"
    env_file:
      - .env.${NODE_ENV}
    ports:
      - 5432:5432
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      args:
        - NODE_ENV=${NODE_ENV}
    init: true # prevent zombie worker deadlocks
    env_file:
      - .env.${NODE_ENV}
    environment:
      - WEB_CONCURRENCY=1
      - PM2_WORKERS=1
    env:
      NODE_ENV: ${{ vars.NODE_ENV }}
      CLIENT_PORT: ${{ vars.CLIENT_PORT }}
      API_PORT: ${{ vars.API_PORT }}
      POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

    ports:
      - $API_PORT:$API_PORT
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:$API_PORT"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  client:
    build:
      context: .
      dockerfile: apps/web-client/Dockerfile
    init: true # prevent zombie worker deadlocks
    ports:
      - "$CLIENT_PORT:8080"
    depends_on:
      - api
        # condition: service_healthy # wait for health check
    networks:
      - app_network

    healthcheck:
      # TODO use env for port
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:$CLIENT_PORT/"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:
