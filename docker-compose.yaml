services:
  # In the future we will have one or more database nodes and potentially a messaging queue.
  # During development, we have injected an in-memory implementation of the persistence layer.
  # This is because choosing a concrete DB and implementing repositories is predictable work
  # and we want to tackle uncertain \ unknown parts of the system before committing to this work.

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - .env.${NODE_ENV}
    ports:
      - $API_PORT:$API_PORT
    networks:
      - app_network

  client:
    build:
      context: .
      dockerfile: apps/web-client/Dockerfile
    ports:
    # TODO make sure this works
      - "$CLIENT_PORT:80"
    depends_on:
      - api
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:
