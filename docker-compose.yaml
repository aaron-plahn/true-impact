services:
  # Note: If you are assigning a custom name to your db service on the line below, make sure it does not contain underscores
  # Currently, the `db` is only used for `SuperTokens`
  db:
    image: "postgres:latest"
    env_file:
      - .env.${NODE_ENV}
    # environment:
      # POSTGRES_USER: todo
      # POSTGRES_PASSWORD: todo
      # POSTGRES_DB: $EVENT_STORE_DB_NAME # why doesn't this work?
    ports:
      - 5432:5432
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    env_file:
      - .env.${NODE_ENV}
    ports:
      - $API_PORT:$API_PORT
    networks:
      - app_network

  client:
    build:
      context: .
      dockerfile: apps/web-client/Dockerfile
    ports:
      - "$CLIENT_PORT:80"
    depends_on:
      - api
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:
