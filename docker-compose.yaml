services:
  # Note: If you are assigning a custom name to your db service on the line below, make sure it does not contain underscores
  # Currently, the `db` is only used for `SuperTokens`
  db:
    image: "postgres:latest"
    env_file:
      - .env.${NODE_ENV}
    # environment:
      # POSTGRES_USER: todo
      # POSTGRES_PASSWORD: todo
      # POSTGRES_DB: $EVENT_STORE_DB_NAME # why doesn't this work?
    ports:
      - 5432:5432
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    init: true # prevent zombie worker deadlocks
    env_file:
      - .env.${NODE_ENV}
    environment:
      - WEB_CONCURRENCY=1
      - PM2_WORKERS=1
    ports:
      - $API_PORT:$API_PORT
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:$API_PORT"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  client:
    build:
      context: .
      dockerfile: apps/web-client/Dockerfile
    init: true # prevent zombie worker deadlocks
    ports:
      - "$CLIENT_PORT:8080"
    depends_on:
      - api
        # condition: service_healthy # wait for health check
    networks:
      - app_network

    healthcheck:
      # TODO use env for port
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:$CLIENT_PORT/"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  app_network:
    driver: bridge

volumes:
  pgdata:
